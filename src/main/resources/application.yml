server:
  servlet:
    context-path: /api

spring:
  application:
    name: app
  main:
    web-application-type: servlet
  mvc:
    api-version:
      default: "1.0"
      use:
        header: "X-API-VERSION"
      required: false
      supported:
        - "1.0"
        - "2.0"
        - "3.0"
  http:
    codecs:
      max-in-memory-size: 10MB
  datasource:
    url: jdbc:h2:tcp://localhost/~/.h2/llgs;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: debug

exchange:
  webclient:
    connect-timeout: 5s
    read-timeout: 10s
    write-timeout: 10s
    response-timeout: 10s
    pool:
      name: exchange-pool
      max-connections: 100
      pending-acquire-timeout: 5s
      max-idle-time: 30s
      max-life-time: 5m
      evict-in-background: 60s
  kw:
    base-url: https://api.kiwoom.com
    app-key: ${KW_APP_KEY:}
    app-secret: ${KW_APP_SECRET:}
    rate-limit:
      requests-per-second: 5  # 키움 호출횟수 제한 정책 (초당 최대 호출횟수)